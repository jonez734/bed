# Managed by bed (make -C bed/src install-pgsql). Appended to:
#   /var/lib/pgsql/18/data/pg_hba.conf
# Lets the rollback login connect over TCP from this host through the bedmap above. Remove at
# cutover, together with the bed role.
#
# TYPE  DATABASE  USER  ADDRESS          METHOD  OPTIONS
host    zoid6     bed   127.0.0.1/32     ident   map=bedmap
